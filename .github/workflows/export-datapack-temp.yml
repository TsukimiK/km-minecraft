name: Export datapack temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-datapack-temp.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload current datapack
        uses: actions/upload-artifact@v4
        with:
          name: current-km-datapack
          path: km-minecraft-datapack-26.2.zip
          if-no-files-found: error
          retention-days: 1
