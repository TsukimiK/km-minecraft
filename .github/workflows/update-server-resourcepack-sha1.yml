name: Update server resource pack SHA1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-resourcepack-26.2.zip'

permissions:
  contents: write

jobs:
  update-sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate SHA-1
        shell: bash
        run: |
          set -euo pipefail
          test -f server-resourcepack-26.2.zip
          sha1sum server-resourcepack-26.2.zip | awk '{print $1}' > server-resourcepack-26.2.sha1
          echo "SHA1=$(cat server-resourcepack-26.2.sha1)"

      - name: Commit SHA-1 if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-resourcepack-26.2.sha1
          if git diff --cached --quiet; then
            echo 'SHA1 is already up to date.'
            exit 0
          fi
          git commit -m 'Update server resource pack SHA1'
          git pull --rebase origin main
          git push origin main
